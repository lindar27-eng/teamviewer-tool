<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Analyse-Tool TeamViewer – Bausteine 1 bis 6</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#E9EDF3; --ink:#14233A; --ink-2:#4A5A72; --line:#D3DAE5;
  --ist:#1D63D8; --ist-soft:rgba(29,99,216,.14); --soll:#B86A00; --soll-soft:rgba(184,106,0,.11); --gruen:#2E8B6E; --gruen-soft:rgba(46,139,110,.13);
  --warn:#9A3B00; --warn-bg:#FFF1E2; --g-ok:#2E8B57; --g-mid:#B8860B; --g-bad:#C0392B; --hero:#0E2A52;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0F1724; --surface:#172234; --surface-2:#1F2C42; --ink:#E7ECF4; --ink-2:#A6B3C7; --line:#2C3B55;
  --ist:#6EA4FF; --ist-soft:rgba(110,164,255,.18); --soll:#F0A640; --soll-soft:rgba(240,166,64,.13); --gruen:#5CC8A3; --gruen-soft:rgba(92,200,163,.15);
  --warn:#FFB77A; --warn-bg:#3A2614; --g-ok:#5CC88A; --g-mid:#F0C040; --g-bad:#FF7A6B; --hero:#08182F; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Source Sans 3",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:17px;line-height:1.45;overflow-x:clip}
h1,h2,h3,h4{font-family:Archivo,"Arial Narrow",Arial,sans-serif;line-height:1.15;margin:0}
a{color:var(--ist)}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ist);outline-offset:2px}

/* Kopfzeile */
.top{position:sticky;top:0;z-index:20;background:var(--hero);color:#fff}
.top-in{max-width:1240px;margin:0 auto;padding:8px 20px;display:flex;align-items:center;gap:14px}
.brand{font-family:Archivo,Arial,sans-serif;font-weight:800;font-size:16px;white-space:nowrap;background:none;border:none;color:#fff;cursor:pointer;padding:4px 0}
.brand span{font-weight:500;opacity:.6}
.nav{display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;position:relative}
.nav a{position:relative;display:flex;align-items:center;gap:7px;padding:7px 11px;border-radius:999px;color:#fff;text-decoration:none;font-size:15px;white-space:nowrap;opacity:.78}
.nav a:hover{opacity:1;background:rgba(255,255,255,.08)}
.nav a[aria-current="page"]{opacity:1}
.nav a{isolation:isolate}
.nav .pill{position:absolute;inset:0;border-radius:999px;background:rgba(255,255,255,.16);view-transition-name:navpill;z-index:-1}
.nav b{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 5px;border-radius:11px;border:1.5px solid rgba(255,255,255,.6);font-size:12px;font-family:Archivo,Arial,sans-serif}
.nav a[aria-current="page"] b{background:#fff;color:var(--hero);border-color:#fff}
.nav span.fut{display:flex;align-items:center;gap:7px;padding:7px 9px;font-size:15px;opacity:.32;white-space:nowrap}
.tbtn{background:none;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:6px;padding:5px 10px;cursor:pointer;font-size:14px;white-space:nowrap}
.tbtn[aria-pressed="true"]{background:#fff;color:var(--hero)}
.arrows{display:flex;gap:4px}
.arrows button{width:32px;height:32px;padding:0;font-size:16px}

main{max-width:1240px;margin:0 auto;padding:22px 20px 70px}
.view[hidden]{display:none}

/* Seitenkopf */
.ph{display:grid;grid-template-columns:auto 1fr auto;gap:6px 16px;align-items:center;margin-bottom:16px}
.kick{grid-row:1/3;width:64px;height:64px;border-radius:16px;background:var(--ist);color:#fff;display:grid;place-items:center;font-family:Archivo,Arial,sans-serif;font-weight:800;font-size:28px}
:root[data-theme="dark"] .kick{color:#0F1724}
.ph h1{font-size:clamp(28px,3.6vw,40px);font-weight:800;letter-spacing:-.01em;width:fit-content}
.ph .claim{grid-column:2/4;margin:0;font-size:18.5px;color:var(--ink);max-width:95ch}
.ph .claim b{color:var(--ist)}
.req{position:relative;justify-self:end}
.req summary{list-style:none;cursor:pointer;font-size:14px;font-weight:700;padding:5px 12px;border-radius:999px;background:var(--gruen-soft);color:var(--gruen);white-space:nowrap}
.req summary::-webkit-details-marker{display:none}
.req.open-todo summary{background:var(--warn-bg);color:var(--warn)}
.req ul{position:absolute;right:0;top:36px;z-index:15;width:min(520px,86vw);list-style:none;margin:0;padding:8px 14px;background:var(--surface);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.18);font-size:14.5px}
.req li{display:grid;grid-template-columns:24px 1fr;gap:6px;padding:5px 0;border-bottom:1px solid var(--line)}
.req li:last-child{border-bottom:none}
.req li .ck{font-weight:800;color:var(--g-ok)}
.req li.todo .ck{color:var(--g-bad)}
.req em{font-style:normal;color:var(--ink-2)}

/* Bausteine */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g-52{grid-template-columns:minmax(0,5fr) minmax(0,4fr)}
.grid>*{min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;min-width:0}
.card>h2{font-size:19px;margin-bottom:10px;display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.card>h2 small{font-family:"Source Sans 3",sans-serif;font-weight:400;font-size:14px;color:var(--ink-2)}
.sec{margin-top:18px}
.note{font-size:14px;color:var(--ink-2)}
.src{display:inline-block;font-size:12.5px;line-height:1.2;padding:2px 7px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);text-decoration:none;margin:0 0 0 3px;vertical-align:1px;white-space:nowrap}
.src.assume{background:var(--warn-bg);color:var(--warn)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 13px;cursor:pointer;font-weight:600;font-size:14.5px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface);flex-wrap:wrap}
.seg button{border:none;background:none;padding:6px 14px;cursor:pointer;font-size:14.5px;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ist);color:#fff}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{color:#0F1724}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.edit textarea,.edit input,textarea.ed,input.ed{width:100%;border:1px solid var(--line);border-radius:5px;background:var(--bg);padding:5px 7px;font-size:14.5px;resize:vertical}
select.s{border:1px solid var(--line);border-radius:5px;background:var(--bg);padding:3px 5px;font-size:14.5px}
details.more{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
details.more>summary{cursor:pointer;padding:11px 16px;font-weight:700;font-size:15.5px;list-style:none;color:var(--ink-2)}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:"+";display:inline-block;width:20px;color:var(--ist);font-weight:800}
details.more[open]>summary::before{content:"–"}
details.more>.in{padding:0 16px 16px}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th,.tbl td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl thead th{font-size:13px;color:var(--ink-2);font-weight:600}
.tbl .n{text-align:center}
.tw{overflow-x:auto}
.letter{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--surface);font-family:Archivo,Arial,sans-serif;font-weight:700;font-size:13px;margin-right:6px;vertical-align:1px;flex:none}
.amp{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.amp.gruen{background:var(--g-ok)}.amp.gelb{background:var(--g-mid)}.amp.rot{background:var(--g-bad)}
.badge{font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--warn-bg);color:var(--warn)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13.5px;color:var(--ink-2);margin-top:6px}
.legend i{display:inline-block;width:18px;height:0;vertical-align:middle;margin-right:5px;border-top:3px solid var(--ist)}
.legend i.soll{border-top:3px dashed var(--soll)}
.legend i.br{border-top:3px dotted var(--gruen)}
.legend i.nach{border-top:3px solid var(--gruen)}

/* Startseite */
.hero{position:relative;overflow:hidden;border-radius:18px;background:var(--hero);color:#fff;padding:44px 44px 40px;margin-bottom:18px}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;filter:blur(2px);opacity:.55}
.hero::before{width:520px;height:520px;right:-120px;top:-220px;background:radial-gradient(circle at 30% 30%,#2F7BFF,transparent 65%)}
.hero::after{width:420px;height:420px;right:220px;bottom:-260px;background:radial-gradient(circle at 50% 50%,#F0A640,transparent 65%);opacity:.35}
.hero>*{position:relative}
.hero .k{font-size:14px;letter-spacing:.12em;text-transform:uppercase;opacity:.75;font-weight:700}
.hero h1{font-size:clamp(34px,5.4vw,64px);font-weight:800;letter-spacing:-.015em;margin:8px 0 10px;view-transition-name:herotitle;width:fit-content}
.hero p.s{font-size:clamp(17px,1.8vw,21px);max-width:62ch;margin:0;opacity:.92}
.hero .meta{display:flex;gap:18px;flex-wrap:wrap;margin-top:22px;font-size:15px;opacity:.85;align-items:center}
.hero .meta input{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);border-radius:6px;color:#fff;padding:4px 9px;min-width:260px}
.hero .meta input::placeholder{color:rgba(255,255,255,.6)}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:26px;background:rgba(255,255,255,.18);border-radius:10px;overflow:hidden}
.facts div{background:rgba(9,28,58,.55);padding:12px 14px}
.facts .v{font-family:Archivo,Arial,sans-serif;font-weight:800;font-size:24px}
.facts .l{font-size:13.5px;opacity:.8;line-height:1.3}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.tile{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;min-width:0;transition:transform .2s,box-shadow .2s}
.tile:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(14,42,82,.14)}
.tile .tn{width:44px;height:44px;border-radius:12px;background:var(--ist);color:#fff;display:grid;place-items:center;font-family:Archivo,Arial,sans-serif;font-weight:800;font-size:20px}
:root[data-theme="dark"] .tile .tn{color:#0F1724}
.tile h2{font-size:21px;width:fit-content}
.tile p{margin:0;font-size:15px;color:var(--ink-2)}
.tile .viz{margin-top:auto;height:96px;display:flex;align-items:end}
.tile .viz svg{width:100%;height:96px}
.futs{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:14px}
.fut-t{border:1px dashed var(--line);border-radius:14px;padding:12px 16px;color:var(--ink-2);font-size:15px}
.fut-t b{font-family:Archivo,Arial,sans-serif}
.hint{margin-top:16px;font-size:14px;color:var(--ink-2);text-align:center}
kbd{font-family:inherit;font-size:12.5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--surface)}

/* B1 */
.lede{font-family:Archivo,Arial,sans-serif;font-size:clamp(19px,2vw,23px);font-weight:600;line-height:1.3}
.dims{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.dim{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--ist);border-radius:10px;padding:13px 14px;min-width:0}
.dim h3{font-size:18px}
.dim .f{font-size:13px;color:var(--ink-2);margin:2px 0 8px}
.dim p{margin:0 0 6px;font-size:15.5px}
.tri{display:grid;grid-template-columns:1fr 300px 1fr;grid-template-rows:auto auto;gap:12px;align-items:center}
.tri>*{min-width:0}
.tri .c{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:15px}
.tri .c h3{font-size:17px;margin-bottom:4px;color:var(--ist)}
.tri .c h3 small{font-family:"Source Sans 3",sans-serif;font-weight:400;color:var(--ink-2);font-size:13px}
svg.trisvg text{font-family:Archivo,Arial,sans-serif;font-weight:800;fill:var(--ink);font-size:18px}
svg.trisvg polygon{fill:var(--ist-soft);stroke:var(--ist);stroke-width:2.5}
svg.trisvg circle{fill:var(--surface);stroke:var(--soll);stroke-width:2.5}
.sf{border-left:5px solid var(--g-ok)}
.sf.q{border-left-color:var(--soll)}
.sf h3{font-size:15px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2);margin-bottom:4px}

/* Radar */
svg.radar text{font-family:"Source Sans 3",Arial,sans-serif;fill:var(--ink-2);font-size:11.5px}
svg.radar .grid{fill:none;stroke:var(--line)}
svg.radar .axis{stroke:var(--line)}
svg.radar .ist{fill:var(--ist-soft);stroke:var(--ist);stroke-width:2.4}
svg.radar .soll{fill:none;stroke:var(--soll);stroke-width:2;stroke-dasharray:6 4}
svg.radar .br{fill:none;stroke:var(--gruen);stroke-width:2;stroke-dasharray:2 4}
svg.radar .nach{fill:var(--gruen-soft);stroke:var(--gruen);stroke-width:2.4}
svg.radar circle.pt{fill:var(--ist)}
.gaps{list-style:none;margin:0;padding:0;counter-reset:g}
.gaps li{counter-increment:g;display:grid;grid-template-columns:34px 1fr auto;gap:8px;padding:9px 0;border-top:1px solid var(--line);align-items:baseline}
.gaps li::before{content:counter(g);font-family:Archivo,Arial,sans-serif;font-weight:800;font-size:24px;color:var(--soll);line-height:1}
.gaps .v{font-family:Archivo,Arial,sans-serif;font-weight:700;white-space:nowrap}
.gaps span.e{font-size:13.5px;color:var(--ink-2);display:block}
.means input{width:56px;text-align:right;border:1px solid var(--line);border-radius:4px;background:var(--bg);padding:2px 5px}
.means td,.means th{text-align:right}
.means td:first-child,.means th:first-child{text-align:left}
.crit-t td{font-size:14.5px}
.crit-t .st{font-size:13px;color:var(--ink-2)}
.crit-t textarea{min-height:58px}
.verdict{margin:10px 0 0;padding:8px 12px;border-left:4px solid var(--ist);background:var(--ist-soft);font-size:15.5px}
.ev{font-weight:700}.ev.vorn{color:var(--g-ok)}.ev.zurück{color:var(--g-bad)}.ev.gleichauf{color:var(--g-mid)}

/* B3 */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;cursor:pointer;font-size:15px;display:inline-flex;gap:6px;align-items:baseline}
.chip .no{font-family:Archivo,Arial,sans-serif;font-weight:700;color:var(--ink-2);font-size:12.5px}
.chip.kern{background:var(--ist);border-color:var(--ist);color:#fff;font-weight:700}
.chip.kern .no{color:rgba(255,255,255,.8)}
:root[data-theme="dark"] .chip.kern{color:#0F1724}
.chip[aria-expanded="true"]{outline:3px solid var(--soll);outline-offset:1px}
.patdet{margin-top:10px;padding:10px 14px;background:var(--surface-2);border-radius:8px;font-size:15px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:5px}
.pgrid button{border:1px solid var(--line);background:var(--surface);padding:6px 8px;text-align:left;cursor:pointer;border-radius:6px;font-size:13.5px;line-height:1.2}
.pgrid button.on{border-color:var(--ist);background:var(--ist-soft);font-weight:700}
.wts{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.wts label{display:block;font-weight:600;font-size:14.5px}
.wts output{float:right;font-family:Archivo,Arial,sans-serif;font-weight:700}
.wts input{width:100%;accent-color:var(--ist)}
.board tr.toprow td{background:var(--soll-soft)}
.board .rank{font-family:Archivo,Arial,sans-serif;font-weight:800;font-size:19px;color:var(--soll);text-align:center}
.board .sum{font-family:Archivo,Arial,sans-serif;font-weight:800;font-size:17px;text-align:center}
.board .sub{font-size:13px;color:var(--ink-2)}
.board .ttl{font-weight:700}
.board .tt{display:flex;align-items:baseline}
.board tr.row{cursor:pointer}
.board td.det{background:var(--surface-2)}
svg.omap text{font-family:"Source Sans 3",Arial,sans-serif;fill:var(--ink-2);font-size:12px}
svg.omap .q{fill:var(--gruen-soft)}
svg.omap .ax{stroke:var(--ink-2)}
svg.omap .gl{stroke:var(--line);stroke-dasharray:3 3}
svg.omap .lt{fill:#fff;font-family:Archivo,Arial,sans-serif;font-weight:700;font-size:13px}
.top2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.top2>*{min-width:0}
.topc{border-top:5px solid var(--soll)}
.topc h3{font-size:19px;display:flex;align-items:baseline;gap:4px}
.topc .meta{font-size:14px;color:var(--ink-2);margin:4px 0 10px}
.vn td{font-size:14px}
.vn td:first-child{font-family:Archivo,Arial,sans-serif;font-weight:700;width:56px}
.vn tr.chg td:last-child{background:var(--soll-soft)}
.vn .same{color:var(--ink-2);font-style:italic}
.bmc{display:grid;grid-template-columns:repeat(10,1fr);grid-template-areas:"kp kp ka ka vp vp cr cr cs cs" "kp kp kr kr vp vp ch ch cs cs" "co co co co co re re re re re";gap:3px;font-size:12px;margin-top:6px}
.bmc div{background:var(--surface-2);padding:5px 6px;line-height:1.25;min-height:34px}
.bmc div.new{background:var(--soll-soft);outline:2px solid var(--soll)}
.bmc b{display:block;font-size:11px;color:var(--ink-2)}
.emp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.emp label{font-family:Archivo,Arial,sans-serif;font-weight:700;font-size:14px;display:block;margin-bottom:3px}
.emp textarea{min-height:120px}

/* B4 */
.persona{display:flex;gap:14px;align-items:center}
.av{flex:none;width:52px;height:52px;border-radius:50%;background:var(--ist-soft);border:2px solid var(--ist);display:grid;place-items:center;font-family:Archivo,Arial,sans-serif;font-weight:800;font-size:19px;color:var(--ist)}
.persona p{margin:0;font-size:15.5px}
.jm-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table.jm{border-collapse:separate;border-spacing:0;min-width:1100px;width:100%;font-size:14px;line-height:1.35}
.jm th,.jm td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:7px 8px;vertical-align:top;text-align:left}
.jm tr:last-child td,.jm tr:last-child th{border-bottom:none}
.jm .rh{position:sticky;left:0;z-index:2;background:var(--surface-2);min-width:104px;width:104px;font-size:12.5px;font-weight:700;color:var(--ink-2);text-transform:uppercase;letter-spacing:.03em}
.jm thead th{background:var(--surface-2);font-family:Archivo,Arial,sans-serif;font-size:15px}
.jm thead th .pn{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--ist);color:#fff;font-size:11.5px;margin-right:5px;vertical-align:1px}
:root[data-theme="dark"] .jm thead th .pn{color:#0F1724}
.jm thead th.big{background:var(--soll-soft);box-shadow:inset 0 4px 0 var(--soll)}
.jm thead th .bt{display:block;font-family:"Source Sans 3",sans-serif;font-size:11.5px;font-weight:700;color:var(--soll)}
.jm td.big{background:var(--soll-soft)}
.jm .pain{color:var(--warn)}
.jm tr.so td{background:var(--gruen-soft)}
.jm tr.so .rh{color:var(--gruen)}
.tp{display:block;margin-bottom:4px}
.tp::before{content:"●";color:var(--ist);margin-right:5px;font-size:11px;vertical-align:1px}
.tp.off::before{content:"○";color:var(--soll);font-weight:800}
.emo{display:inline-block;font-weight:700;font-size:13px;padding:1px 9px;border-radius:999px;background:var(--surface-2)}
.emo.neg{background:var(--warn-bg);color:var(--warn)}
.emo.pos{background:var(--gruen-soft);color:var(--gruen)}

/* Morph-Übergänge */
::view-transition-old(root),::view-transition-new(root){animation-duration:.42s;animation-timing-function:cubic-bezier(.2,.7,.2,1)}
html[data-dir="fwd"]::view-transition-old(root){animation-name:vtOutL}
html[data-dir="fwd"]::view-transition-new(root){animation-name:vtInR}
html[data-dir="back"]::view-transition-old(root){animation-name:vtOutR}
html[data-dir="back"]::view-transition-new(root){animation-name:vtInL}
::view-transition-group(*){animation-duration:.55s;animation-timing-function:cubic-bezier(.2,.75,.15,1)}
::view-transition-group(navpill){animation-duration:.4s}
@keyframes vtOutL{to{opacity:0;transform:translateX(-40px)}}
@keyframes vtInR{from{opacity:0;transform:translateX(40px)}}
@keyframes vtOutR{to{opacity:0;transform:translateX(40px)}}
@keyframes vtInL{from{opacity:0;transform:translateX(-40px)}}
.view.enter{animation:vtInR .4s cubic-bezier(.2,.7,.2,1)}
.reveal>*{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
.reveal>*:nth-child(2){animation-delay:.06s}.reveal>*:nth-child(3){animation-delay:.12s}.reveal>*:nth-child(4){animation-delay:.18s}.reveal>*:nth-child(5){animation-delay:.24s}.reveal>*:nth-child(6){animation-delay:.3s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@media (prefers-reduced-motion: reduce){
  ::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}
  .reveal>*,.view.enter{animation:none}
}

    zusatz: [
      {n:"Digitale Souveränität", f:"Wie abhängig ist das Modell von einzelnen Cloud-, KI- und Plattformanbietern?", s:"1 hoch abhängig, ohne Ausweg · 2 abhängig, Ausweg unklar · 3 Abhängigkeiten bekannt, teilweise Alternativen · 4 realistische Ausstiegsoptionen", ist:2, soll:3,
       b:"KI-Modelle kommen von Partnern (nicht benannt), Cloud- und IT-Dienstleister stellen Infrastruktur; Plattformen wie ServiceNow und Microsoft sind zugleich wichtige Vertriebskanäle. Rechenzentren sind ISO-27001-zertifiziert, die Liste der Unterauftragsverarbeiter ist öffentlich. Ausstiegsoptionen werden nicht beschrieben, daher Stufe 2. Folge des Data Act: Kunden können ab 12.01.2027 ohne Wechselentgelte wechseln – das schwächt das Muster Lock-in.", q:"GB S. 28, GB S. 33, GB S. 58"},
      {n:"Cybersicherheit und Resilienz", f:"Notfallpläne, Backups, Lieferanten, Verantwortung, Übungen?", s:"1 kaum geregelt · 2 Grundschutz · 3 zertifiziert und geübt · 4 zertifiziert, geübt, extern bestätigt und vom Vorstand gesteuert", ist:4, soll:4,
       b:"ISO 27001, SOC 2, BSI C5, CSA STAR; Business Continuity Management, Krisenpläne und Bug-Bounty-Programm; Incident-Response-Teams rund um die Uhr mit externem SOC; Security Steering Board alle zwei Wochen mit zwei Vorstandsmitgliedern; BitSight: beste 1 % der Software-Branche. Risiko „Produkt- und IT-Sicherheit“ bleibt laut Bericht erheblich. NIS2: TeamViewer unterstützt Kunden bei der Umsetzung; ob TeamViewer selbst als Cloud-Anbieter betroffen ist, sagt der Bericht nicht (Einordnung: wahrscheinlich, keine Rechtsberatung).", q:"GB S. 31ff., GB S. 105"},
      {n:"Weiterbildung und Change", f:"Welche Rolle spielen Weiterbildung und Change-Management?", s:"1 keine Maßnahmen · 2 einzelne Pflichtschulungen · 3 Programme für Schlüsselthemen · 4 systematische Kompetenzentwicklung mit Change-Begleitung", ist:2, soll:3,
       b:"Pflichtschulungen zu Datenschutz und Sicherheit für alle, KI-Tool-Schulungen für mehrere Abteilungen, Ausbau 2026. Viel Umbau: Integration von 1E, Abgänge im 1E-Vertrieb, neue Marketing- und Vertriebsorganisation, neuer CMO. Personalrisiken stuft TeamViewer selbst als hoch ein. Ein Programm zur Change-Begleitung wird nicht beschrieben.", q:"GB S. 31, GB S. 36f., GB S. 105, PR3 S. 13"}

    datenreife: [
      {f:"Welche Daten entstehen?", amp:"gruen", a:"Daten aus Millionen Support-Sitzungen, Echtzeit-Daten der Endgeräte aus DEX (Verlauf über 14 Tage), über 5,5 Mio. KI-Sitzungen, Vertrags- und Nutzungsdaten von rund 607.000 Kunden. Nicht belegt: systematische Erfassung von Kündigungsgründen.", q:"GB S. 8, GB S. 29, PR3 S. 12, QM3 S. 6"},
      {f:"Wer darf sie nutzen?", amp:"gelb", a:"Kundendaten sind oft personenbezogen: DSGVO mit Privacy-Management-Framework, TeamViewer als Verantwortlicher und Auftragsverarbeiter. Aus Sitzungen lernt TeamViewer nur mit Zustimmung der Kunden. Data Act: relevant für vernetzte Produkte in der Industrie (Frontline, OT), Einordnung.", q:"GB S. 8, GB S. 35"},
      {f:"Wie gut sind Qualität und Zugang?", amp:"gelb", a:"Die Plattform ONE vereinheitlicht Datenbestände aus den Produktlinien; die Integration von 1E ist aber noch nicht abgeschlossen (laufende Systemintegrationen 2026).", q:"GB S. 22, QM3 S. 7"},
      {f:"Wofür werden sie genutzt?", amp:"gelb", a:"Für Produkte (Session Insights, Tia, Resolution Center) und im Vertrieb (ROI-Berechnung im DEX-Verkauf). Für Preise und neue Erlösmodelle bisher kaum: KI wird als Add-on verkauft – genau hier setzen die Ideen A und B an.", q:"GB S. 27, GB S. 40"},

      fazit:"TeamViewer liegt bei Überwachung, Einstieg und Breite vorn und bei der Autonomie gleichauf. Zurück liegt das Unternehmen beim Preis für KI: Wettbewerber geben KI im Paket mit. Folge für die Empfehlung: Idee A (KI-Grundstufe in jeder Lizenz) schließt genau diese Lücke. Grenzen: Wettbewerber-Angaben stammen teils von Vergleichsseiten, Atera und Microsoft sind nur in Teilen vergleichbar (anderes Segment beziehungsweise Plattformanbieter)."
    },
    branchText: "Branche: Software für IT-Support und digitalen Arbeitsplatz, also Teil des am stärksten digitalisierten Sektors. Zum Vergleich: EU-weit erreichen 72 % der Unternehmen ein grundlegendes Digitalisierungsniveau; Deutschland liegt im Bitkom-DESI 2026 auf Platz 17 von 27 (Q13).\n\nAnalysten: Leader im Gartner Magic Quadrant für DEX Management Tools 2025, „Leader“ im ISG Provider Lens 2025 in zwei Kategorien, „Best-in-Class“ im PAC RADAR für Connected-Worker-Plattformen (GB S. 40). Achtung: Selbstdarstellung im eigenen Bericht.\n\nAussage: Beim Grad der Digitalisierung gibt es in dieser Branche kaum Abstand, alle Anbieter sind rein digital. Der Wettbewerb entscheidet sich an KI-Autonomie, Preismodell für KI und Einbindung in fremde Plattformen. Risiko laut eigenem Bericht: große Softwareanbieter könnten das Angebot überlagern (GB S. 106).",
    perception: "Vor der Analyse hätten wir TeamViewer als reinen Softwareanbieter durchgängig auf Stufe 4 eingeschätzt. Für das Geschäftsmodell (4,0) und weitgehend auch für das Produkt (3,6) bestätigt sich das. Überrascht hat uns, dass ausgerechnet die Kundenanbindung mit 3,1 am niedrigsten liegt: Ein Unternehmen, das Daten aus Millionen Support-Sitzungen für seine KI auswertet, nutzt Daten zur Bindung der eigenen Kunden offenbar noch wenig. Eine SMB-Abwanderung von 17 % pro Jahr hätten wir bei einem so bekannten Produkt nicht erwartet. Bei der Autonomie sind wir strenger als die Selbstdarstellung im Geschäftsbericht: TeamViewer spricht von autonomer IT, beschreibt aber selbst eine „kontrollierte“ Behebung mit Freigabe durch Experten, deshalb bleiben wir bei Stufe 3. Bei der Interaktion mit Kunden ließe sich auch Stufe 3 vertreten, weil Großkunden persönlich betreut werden; wir bleiben bei 4, da Nutzung, Kauf und Support überwiegend digital laufen.",
    leitfragen: [
      {f:"Welche Geschäftsprozesse haben durch weitere Digitalisierung das höchste Potenzial für Effizienz?", a:"Enterprise-Vertrieb, weil die Pipeline-Konversion laut CEO zu langsam ist, und die Verlängerung im SMB-Geschäft (Abwanderung 17 %): Kündigungsrisiken früh aus Nutzungsdaten erkennen. Im eigenen Support Tia einsetzen.", q:"QM3 S. 2, PR3 S. 11"},
      {f:"Welche ergänzenden Dienstleistungen lassen sich auf Basis der Digitalisierung anbieten?", a:"Bereits vorhanden: DEX Essentials und TeamViewer AI als Add-ons, Managed Services über MSP (TeamUP MSP). Nächste Schritte: KI-Grundstufe in jeder Lizenz (Idee A), Benchmarks aus DEX-Daten nur mit Zustimmung (Idee D).", q:"GB S. 40f."},
      {f:"Welche Produkte können als Dienstleistung verkauft werden?", a:"Alles ist bereits im Abo. Der nächste Schritt wäre Abrechnung nach Ergebnis, z. B. je von Tia gelöstem Ticket (Idee B), wie es Zendesk im Service-Bereich vormacht.", q:"GB S. 21, W1"},
      {f:"Welcher Zusatznutzen entsteht durch eine digitale Kundenschnittstelle mit Konfiguration?", a:"Der Webshop verkauft schon Lizenzen und Add-ons mit Testversion. Selbst konfigurierbare Pakete (Geräte, Module, KI-Kontingent) senken Hürden für SMB und sparen Verkaufsgespräche bei kleinen Upgrades.", q:"GB S. 26f."},
      {f:"Ist kundenindividuelle Fertigung (Losgröße 1) wirtschaftlich und gewünscht?", a:"Bei Software über Module und Editionen (ONE Standard, Advanced, Enterprise) fast ohne Mehrkosten möglich; gewünscht vor allem von Großkunden und Behörden mit eigenen Anforderungen (z. B. FedRAMP, individuelle Verträge).", q:"GB S. 21, GB S. 33, GB S. 108"},
      {f:"Droht die Gefahr, durch einen Plattformanbieter in der Wertschöpfung nach hinten gedrängt zu werden?", a:"Ja. TeamViewer nennt das Risiko selbst: Große Softwareanbieter könnten ihr Angebot so erweitern, dass es sich mit TeamViewer überschneidet. Microsoft bringt eigene Agenten in Intune. Gegenmittel: eigene Plattform ONE, eigener Agent Tia und Ergebnisse statt nur Verbindung verkaufen (Idee B).", q:"GB S. 106, W5"},
      {f:"Welche Daten können gesammelt werden, und lassen sie sich kommerzialisieren?", a:"Sitzungsdaten, Zustandsdaten der Endgeräte (DEX), KI-Dokumentationen. Heute werden sie vor allem für Produkte genutzt. Kommerzialisierung als Benchmark denkbar, aber DSGVO und Vertrauen begrenzen das (Ampel rot bei Idee D).", q:"GB S. 8, GB S. 35"}
    ]

       kanni:"Erlöse des heutigen Add-ons TeamViewer AI fallen teilweise weg (Höhe nicht veröffentlicht, im Überschlag mit 1 Mio. € angenommen). Neue Erlöse kommen erst mit den Verlängerungen, also zeitversetzt. Wettbewerber profitieren, wenn TeamViewer es nicht tut: NinjaOne liefert KI bereits im Paket.",
       emp:{lage:"Idee A hat bei der Bewertung am besten abgeschnitten (3,85) und bleibt bei allen getesteten Gewichtungen unter den Top 2. Sie setzt an der größten Schwäche an: SMB-Abwanderung von 17 % bei 68 % Anteil am ARR. Der CEO bezeichnet die Kundenbindung selbst als zu niedrig.",
            mass:"TeamViewer nimmt eine KI-Grundstufe in alle SMB-Lizenzen auf und verkauft Tia Pro als Add-on im Webshop. Verantwortlich ist das Produktmanagement SMB gemeinsam mit Pricing und E-Commerce. Pilot in einem EMEA-Land ab Q2 2027, Entscheidung über den Rollout nach sechs Monaten.",
            herl:"Freemium ist laut Geschäftsbericht wesentliches Element der Vertriebsstrategie, und seit Q3 2025 setzt TeamViewer auf Aktivierung statt Preiserhöhungen. Die Kombination aus Freemium und Add-on überträgt dieses Muster auf KI, wie Microsoft mit Copilot Chat und Zendesk mit KI-Agenten in jedem Plan. Kunden erleben den Nutzen, bevor sie zahlen.",
            quelle:"Gassmann, Frankenberger und Csik: Muster 1 Add-on und 18 Freemium, Basisstrategie Kombinieren. Osterwalder und Pigneur (2011) zur Darstellung im Canvas; Christensen (1997) zur Kannibalisierung.",

      {id:"B", t:"Tia im Enterprise je gelöstem Ticket abrechnen", ki:"Tia Troubleshooting, Automations, Resolution Center", muster:"38 Performance-Based Contracting + 48 Subscription", meth:"Konfrontation",

         r:"Hohes Risiko: schwankende Erlöse, Haftung bei autonomen Eingriffen (Großkundenverträge sind laut Geschäftsbericht ohnehin aufwendig), Abhängigkeit von ServiceNow-Daten, Kannibalisierung von Lizenzen. [GB S. 108]"},
       amp:"gelb", rk:"AI Act: Agent greift selbstständig ein; Protokollierung ist vorhanden, menschliche Freigabe für kritische Schritte festlegen. Vertrag: Definition von „gelöst“ und Haftung. Markt: ServiceNow und Microsoft bieten eigene Agenten; Abhängigkeit von Partnerdaten.",

       nach:{wer:"Enterprise-IT und MSP mit hohem Ticketvolumen.", was:"Garantierte Bearbeitung von Standard-Tickets: Kunde kauft Ergebnisse statt Software.", wie:"Messung gelöster Tickets über Session Insights und die ServiceNow-Integration; gemeinsame Definition von „gelöst“.", wert:"Preis je gelöstem Ticket zusätzlich zum Basisabo; Erlöse steigen mit Volumen, schwanken aber."},
       bmc:{vp:"Ergebnis statt Lizenz", kp:"ServiceNow als Datenquelle für die Messung", ka:"Tickets messen und abrechnen", re:"Preis je gelöstem Ticket"},
       kanni:"Wenn Tia Arbeit übernimmt, brauchen Kunden weniger Lizenzen für Support-Mitarbeitende (im Überschlag 5 % des ARR der Pilotkunden). Neue Erlöse kommen erst mit Volumen: Cashflow-Lücke am Anfang. Wenn TeamViewer es nicht tut, liefern ServiceNow oder Microsoft den Agenten und TeamViewer nur die Verbindung.",
       emp:{lage:"Idee B liegt auf Platz 2 (3,55) und hat den höchsten Nutzenwert. Das Enterprise-Geschäft wächst, doch die NRR fiel auf 93 %, und laut CRO soll die Kundenbindung bei Großkunden gestärkt werden. Zugleich nennt TeamViewer große Softwareanbieter mit eigenen Angeboten als Wettbewerbsrisiko (GB S. 106).",
            mass:"TeamViewer bietet Enterprise-Kunden und MSP ein Zusatzmodell an, bei dem Tia je gelöstem Standard-Ticket abgerechnet wird. Verantwortlich sind das Enterprise-Produktmanagement und das Partner-Team für ServiceNow. Pilot mit drei bis fünf Bestandskunden ab Q3 2027.",
            herl:"Abrechnung nach Ergebnis überträgt die Logik von Fin und Zendesk auf den IT-Support (Konfrontationsprinzip). TeamViewer kann Ergebnisse über Session Insights und die ServiceNow-Integration messen. Das Muster wirkt dem im Geschäftsbericht genannten Risiko entgegen, dass große Softwareanbieter das Angebot überlagern.",
            quelle:"Gassmann, Frankenberger und Csik: Muster 38 Performance-Based Contracting, Basisstrategie Übertragen. Christensen (1997) zur Kannibalisierung; Kursfolien Termin 3 zu Preismodellen für KI.",
            wirk:"Gelöste Tickets je Kunde und Monat, Lösungsquote ohne Eskalation, Erlös je Pilotkunde gegenüber reinem Abo, Enterprise-NRR (Q3 2026: 93 %). Überschlag: rund 1,3 Mio. € zusätzlicher ARR – der größere Effekt ist die Bindung.",
            risk:"Schwankende Erlöse, unklare Definition von „gelöst“, Kannibalisierung bei Lizenzen, Pflichten nach AI Act bei autonomen Eingriffen, Abhängigkeit von ServiceNow. Ampel gelb."}},

    var end = parseFloat(el.dataset.count), dec = +(el.dataset.dec||0), key = el.dataset.ck;
    var start = fromZero ? 0 : (key && LASTV[key]!=null ? LASTV[key] : end);

function cfRun(c){
  var T = c.T, G = c.G, res = {};
  ["p","s","h"].forEach(function(k){
    var inn = [], out = [];
    for(var t=0; t<=T; t++){
      var i = 0, o = 0;
      if(t === 0) o += c.acq;
      if(t < T) o += c.op*G;
      if(k === "p" && t === 0) i += c.pE*G;
      if(k === "s" && t < T) i += c.pA*G;
      if(k === "h"){ if(t < T) i += c.pB*G; if(t >= 1){ i += c.pF*c.n*G; o += c.ki*c.n*G; } }
      inn.push(i); out.push(o);
    }
    var cum = [], s = 0, net = inn.map(function(v,t){ return v - out[t]; });
    net.forEach(function(v){ s += v; cum.push(s); });
    var be = null; for(var t2=0; t2<=T; t2++){ if(cum.slice(t2).every(function(v){ return v >= 0; })){ be = t2; break; } }
    var ein = inn.reduce(function(a,b){ return a+b; },0), aus = out.reduce(function(a,b){ return a+b; },0);
    res[k] = {inn:inn, out:out, net:net, cum:cum, be:be, sum:s, ein:ein, aus:aus, jg: ein/Math.max(1,T)/G};
  });
  return res;
}
function cfBars(r, k, T){

  var h = '<div class="card reveal"><div class="kjeh"><h2>Kriterien und Gewichte <small>vom Pilot zur Skalierung '+srcChips("K7")+'</small></h2><div class="ph6">'+["Identifizieren","Bewerten","Pilotieren","Skalieren"].map(function(s,i){ return '<span class="'+(i===1?'on':'')+'"><em>'+(i+1)+'</em>'+s+'</span>'; }).join("")+'</div></div><div class="uw6">';
  ["w","m","r","i"].forEach(function(k){ h += '<label class="wk-'+k+'"><b>'+esc(P.ucDesc[k][0])+'</b> <output id="uo-'+k+'"></output><input type="range" min="0" max="60" step="5" value="'+P.uw[k]+'" data-uw="'+k+'"><span class="note">'+esc(P.ucDesc[k][1])+'</span></label>'; });
  h += '</div><div class="wbar6" id="uwbar"></div><button type="button" class="btn sm" id="uwReset" style="margin-top:8px">Gewichte zurücksetzen</button></div>';
  h += '<div class="card sec reveal"><div class="kjeh"><h2>Bewertungsmatrix <small>'+P.uc.length+' Ideen, sortiert nach gewichteter Punktzahl</small></h2></div><div id="ucOut"></div></div>';
  return {req:req, claim:claim, html:h};
}
function renderB6(){
  var r = UI.sub6 === "b" ? renderB6b() : renderB6a();
  var h = head("b6","6","Erlösmodell und KI", r.claim, r.req);
  h += '<div class="tools subtabs"><div class="seg" role="group" aria-label="Teil"><button type="button" data-go="b6a" aria-pressed="'+(UI.sub6!=="b")+'">6a Hybrides Erlösmodell</button><button type="button" data-go="b6b" aria-pressed="'+(UI.sub6==="b")+'">6b KI-Use-Cases</button></div></div>';
  return h + '<div>'+r.html+'</div>';
}

/* ---------- 7 Zielgeschäftsmodell und Maßnahmen ---------- */
function mScore(m, w){ var s = w.w + w.a + w.r || 1; return (m.wi*w.w + (6-m.au)*w.a + (6-m.ri)*w.r)/s; }
function mRanked(){ var w = state.p7.w; return state.p7.mass.map(function(m,i){ return {m:m, i:i, s:mScore(m,w)}; }).sort(function(a,b){ return (b.s-a.s) || (b.m.wi-a.m.wi) || a.m.id.localeCompare(b.m.id); }); }
var QS = ["Q1","Q2","Q3","Q4","Q1","Q2","Q3","Q4"];
function matrix7(rk){
  var W = 440, H = 330, L = 46, R = 14, T = 16, B = 44;
  function X(v){ return L + (v-0.5)/5*(W-L-R); } function Y(v){ return T + (5.5-v)/5*(H-T-B); }
  var s = '<svg class="mx7" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Matrix Wirkung und Aufwand">';
  s += '<rect class="q qw" x="'+L+'" y="'+T+'" width="'+(X(3)-L)+'" height="'+(Y(3)-T)+'"/><rect class="q qh" x="'+X(3)+'" y="'+T+'" width="'+(W-R-X(3))+'" height="'+(Y(3)-T)+'"/><rect class="q ql" x="'+L+'" y="'+Y(3)+'" width="'+(X(3)-L)+'" height="'+(H-B-Y(3))+'"/><rect class="q qz" x="'+X(3)+'" y="'+Y(3)+'" width="'+(W-R-X(3))+'" height="'+(H-B-Y(3))+'"/>';
  s += '<text class="ql" x="'+(L+8)+'" y="'+(T+16)+'">Quick Wins</text><text class="ql" x="'+(W-R-8)+'" y="'+(T+16)+'" text-anchor="end">Große Hebel</text><text class="ql" x="'+(L+8)+'" y="'+(H-B-8)+'">Nebenbei</text><text class="ql" x="'+(W-R-8)+'" y="'+(H-B-8)+'" text-anchor="end">Zurückstellen</text>';
  for(var v=1; v<=5; v++){ s += '<text class="ax" x="'+X(v)+'" y="'+(H-B+16)+'" text-anchor="middle">'+v+'</text><text class="ax" x="'+(L-8)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+v+'</text>'; }
  s += '<text class="at" x="'+((L+W-R)/2)+'" y="'+(H-6)+'" text-anchor="middle">Aufwand →</text><text class="at" transform="translate(12 '+((T+H-B)/2)+') rotate(-90)" text-anchor="middle">Wirkung →</text>';
  var seen = {};
  rk.forEach(function(r, pos){ var m = r.m, key = m.au+"-"+m.wi, n = seen[key] = (seen[key]||0)+1, off = (n-1)*16 - 0;
    var cx = X(m.au) + (n>1? (n%2?1:-1)*Math.ceil((n-1)/2)*20 : 0), cy = Y(m.wi), rr = 13;
    s += '<g class="bub r'+m.ri+(UI.m7===m.id?' on':'')+'" data-m7="'+m.id+'" tabindex="0" role="button" data-tip="'+esc(m.id+' '+m.t+' · Wirkung '+m.wi+', Aufwand '+m.au+', Risiko '+m.ri+' · Rang '+(pos+1))+'"><circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="'+rr+'"/><text x="'+cx.toFixed(1)+'" y="'+(cy+4).toFixed(1)+'" text-anchor="middle">'+(pos+1)+'</text></g>';
  });
  return s + '</svg>';
}
function gantt7(rk){
  var h = '<div class="gt7"><div class="gh"><span></span>'+["2027","2028"].map(function(y){ return '<b style="grid-column:span 4">'+y+'</b>'; }).join("")+'</div><div class="gh q"><span></span>'+QS.map(function(q){ return '<em>'+q+'</em>'; }).join("")+'</div>';
  rk.forEach(function(r, pos){ var m = r.m;
    h += '<div class="gr'+(UI.m7===m.id?' on':'')+'" data-m7="'+m.id+'" tabindex="0" role="button"><span class="gl7"><i class="rk6">'+(pos+1)+'</i><b>'+esc(m.t)+'</b></span><div class="gbar" style="grid-column:'+(m.s+2)+' / span '+(m.p+m.r)+'"><span class="gp" style="flex:'+m.p+'">Pilot</span><span class="go7" style="flex:'+m.r+'">Rollout · '+esc(m.ms)+'</span></div></div>'; });
  return h + '</div>';
}
function live7(){
  var v = document.getElementById("v-b7"); if(!v) return; var root = v.querySelector("#mOut"); if(!root) return;
  var P = state.p7, rk = mRanked();
  ["w","a","r"].forEach(function(k){ var o = v.querySelector("#mo-"+k); if(o) o.textContent = P.w[k]; });
  var h = '<div class="grid mx7w"><div>'+matrix7(rk)+'<div class="legend"><span><i class="rb r1"></i>Risiko gering</span><span><i class="rb r3"></i>mittel</span><span><i class="rb r5"></i>hoch</span><span class="note">Zahl = Rang</span></div></div><div><ol class="rl7">';
  rk.forEach(function(r, pos){ var m = r.m, b = "p7.mass."+r.i;
    h += '<li class="'+(pos<3?'t3':'')+(UI.m7===m.id?' on':'')+'" style="view-transition-name:m7-'+m.id+'"><span class="rk6">'+(pos+1)+'</span><div class="rlb"><b data-m7="'+m.id+'" tabindex="0" role="button">'+esc(m.t)+'</b><span class="note">aus Baustein '+esc(m.aus)+'</span><span class="wa7">Wirkung '+sel(b+".wi", m.wi, 5, "Wirkung")+' Aufwand '+sel(b+".au", m.au, 5, "Aufwand")+' Risiko '+sel(b+".ri", m.ri, 5, "Risiko")+'</span><span class="mc7" aria-label="Machbarkeit">'+P.mach.map(function(n,j){ return '<i class="mk-'+m.mach[j]+'" data-tip="'+esc(n+': '+P.machD[m.mach[j]])+'">'+(n==="Kosten"?"€":n.charAt(0))+'</i>'; }).join("")+'</span></div><span class="sc7"><b>'+fmt2(r.s)+'</b><span class="sbw"><i'+gw("m7"+m.id, (r.s-1)/4*100)+'></i></span></span></li>'; });
  h += '</ol><p class="note" style="margin:4px 0 0">Machbarkeit: D Daten · K Kompetenzen · O Organisation · € Kosten · R Regulierung <span class="mk-l"><i class="mk-g"></i>gegeben <i class="mk-y"></i>mit Aufwand <i class="mk-r"></i>kritisch</span></p></div></div>';
  root.innerHTML = h;
  bindAll(root);
  animBars(root);
  var g = v.querySelector("#gOut"); if(g) g.innerHTML = gantt7(rk);
  v.querySelectorAll("[data-m7]").forEach(function(b){ var fn = function(){ var id = b.dataset.m7; UI.m7 = UI.m7===id ? null : id; live7(); }; b.addEventListener("click", fn); b.addEventListener("keydown", function(e){ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); fn(); } }); });
}
function renderB7(){
  var P = state.p7, rk = mRanked();
  var claim = esc(P.kern)+' Zuerst: <b>'+esc(rk[0].m.t)+'</b>.';
  var req = [["Soll-Modell in den fünf Dimensionen","Zielgeschäftsmodell"],["Maßnahmen nach Wirkung, Aufwand und Risiko priorisiert, Gewichte sichtbar","Priorisierung"],["Roadmap auf einer Übersichtsseite","Roadmap"],["Machbarkeit: Daten, Kompetenzen, Organisation, Kosten, Regulierung","Priorisierung"]];
  var h = '<div class="card reveal"><div class="kjeh"><h2>Zielgeschäftsmodell <small>Ist und Soll in den fünf Dimensionen · Baustein anklicken</small></h2></div><div class="zm7">'+P.dims.map(function(d,i){ return '<div class="zr"><b class="zn">'+esc(d.n)+'</b><div class="zi"><span class="l">Ist</span>'+esc(d.ist)+' '+srcChips(d.istQ)+'</div><i class="za">→</i><div class="zs"><span class="l">Soll</span>'+(EDIT? txt("p7.dims."+i+".soll", d.soll, "Soll", 3) : esc(d.soll))+'<span class="zb">'+d.b.map(function(x){ return '<button type="button" data-go="'+({"2":"b2","3":"b3","4a":"b4a","4b":"b4b","5a":"b5a","5b":"b5b","6a":"b6a","6b":"b6b"})[x]+'">'+x+'</button>'; }).join("")+'</span></div></div>'; }).join("")+'</div></div>';
  h += '<div class="card sec reveal"><div class="kjeh"><h2>Maßnahmen priorisiert <small>Punktzahl = Wirkung und geringer Aufwand und geringes Risiko, gewichtet</small></h2></div><div class="uw6 w3">';
  [["w","Wirkung","Beitrag zu Wachstum und Bindung"],["a","Aufwand","Kosten, Zeit, Personal (umgekehrt gewertet)"],["r","Risiko","Regulierung, Markt, Technik (umgekehrt gewertet)"]].forEach(function(x){ h += '<label><b>'+x[1]+'</b> <output id="mo-'+x[0]+'"></output><input type="range" min="0" max="80" step="5" value="'+P.w[x[0]]+'" data-mw="'+x[0]+'"><span class="note">'+x[2]+'</span></label>'; });
  h += '</div><div id="mOut"></div></div>';
  h += '<div class="card sec reveal"><div class="kjeh"><h2>Roadmap 2027 bis 2028 <small>in Reihenfolge der Priorität · Pilot hell, Rollout dunkel</small></h2></div><div id="gOut" class="tw"></div><p class="verdict">Start mit den Quick Wins (Verlängerungscockpit, KI-Grundstufe, Support-Assistent), weil sie die Abwanderung direkt senken und wenig kosten. Die großen Hebel (Exposure Remediation, Plattform) brauchen Piloten mit wenigen Kunden und laufen bis 2028. '+srcChips("Annahme: Zeitplan der Gruppe")+'</p></div>';
  return {req:req, claim:claim, html:h};
}

/* ---------- Mini-Grafiken ---------- */
function miniCash(){ return '<svg viewBox="0 0 240 96" aria-hidden="true"><polyline points="10,80 60,64 110,50 160,36 230,14" style="fill:none;stroke:var(--gruen);stroke-width:3"/><polyline points="10,72 60,60 110,48 160,38 230,28" style="fill:none;stroke:var(--ist);stroke-width:3"/><polyline points="10,40 60,44 110,48 160,52 230,56" style="fill:none;stroke:var(--soll);stroke-width:3"/></svg>'; }
function miniRoad(){ var s = '<svg viewBox="0 0 240 96" aria-hidden="true">'; [[10,60],[30,80],[60,110],[40,150],[90,130]].forEach(function(b,i){ s += '<rect x="'+b[0]+'" y="'+(8+i*17)+'" width="'+b[1]+'" height="11" rx="5" style="fill:'+(i<2?'var(--gruen)':'var(--ist)')+'"/>'; }); return s + '</svg>'; }

/* ---------- Einhängen ---------- */
RENDER.b6 = renderB6; RENDER.b7 = function(){ var r = renderB7(); return head("b7","7","Zielgeschäftsmodell und Maßnahmen", r.claim, r.req) + '<div>'+r.html+'</div>'; };
var _viewOf6 = viewOf;
viewOf = function(t){ return (t==="b6a"||t==="b6b") ? "b6" : _viewOf6(t); };
ORDER.splice(ORDER.indexOf("src"), 0, "b6a", "b6b");
PAGES.b6a = ["6a","Hybrides Erlösmodell","Rechner, Cashflow, Trend, Archetyp"];
PAGES.b6b = ["6b","KI-Use-Cases","Bewertungsmatrix und Top 3"];
PAGES.b7 = ["7","Zielgeschäftsmodell","Soll, Prioritäten, Roadmap"];
var _miniFor6 = miniFor;
miniFor = function(t){ var v = viewOf(t); if(v==="b6") return miniCash(); if(v==="b7") return miniRoad(); return _miniFor6(t); };
var _go6 = go;
go = function(t){ if(t === "b7") t = "b6b"; if(t === "b6") t = UI.sub6 === "b" ? "b6b" : "b6a"; if(t === "b6a") UI.sub6 = "a"; if(t === "b6b") UI.sub6 = "b"; _go6(t); };
var _show6 = show;
show = function(t){ if(t === "b6a") UI.sub6 = "a"; if(t === "b6b") UI.sub6 = "b"; _show6(t); };
function wire67(sec, v){
  if(v === "b6"){
    sec.querySelectorAll("input[data-cf]").forEach(function(r){ r.addEventListener("input", function(){ state.p6.calc[r.dataset.cf] = +r.value; save(); live6(); }); });
    var cr = sec.querySelector("#cfReset"); if(cr) cr.addEventListener("click", function(){ state.p6.calc = clone(P6.calc); save(); rerender(); });
    sec.querySelectorAll("input[data-uw]").forEach(function(r){ r.addEventListener("input", function(){ state.p6.uw[r.dataset.uw] = +r.value; save(); liveB6b(); }); r.addEventListener("change", function(){ morph(liveB6b); }); });
    var ur = sec.querySelector("#uwReset"); if(ur) ur.addEventListener("click", function(){ state.p6.uw = clone(P6.uw); save(); rerender(); });
    sec.querySelectorAll("[data-jump]").forEach(function(a){ a.addEventListener("click", function(e){ e.preventDefault(); var t = document.getElementById(a.dataset.jump); if(t) t.scrollIntoView({behavior: reduce ? "auto" : "smooth", block:"start"}); }); });
    live6(); liveB6b();
  }
  if(v === "b7"){
    sec.querySelectorAll("input[data-mw]").forEach(function(r){ r.addEventListener("input", function(){ state.p7.w[r.dataset.mw] = +r.value; save(); live7(); }); r.addEventListener("change", function(){ morph(live7); }); });
    live7();
  }
}
var _render6 = render;
render = function(v){ _render6(v); var sec = document.getElementById("v-"+v); if(sec && (v==="b6" || v==="b7")) wire67(sec, v); };

/* ---------- Start ---------- */
(function(){ var h = location.hash.slice(1); if(h==="b0") h = "start"; if(h==="b4a") UI.ph = 0; show(ORDER.indexOf(h) >= 0 ? h : "start"); })();

})();
</script>
